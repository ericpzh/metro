<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1060" width="1600" height="1060" font-family="Inter,'Noto Sans SC','Source Han Sans SC','Microsoft YaHei','PingFang SC','Hiragino Sans GB',Segoe UI,Helvetica,Arial,sans-serif">
<defs>
<g id="person">
  <ellipse cx="0" cy="1" rx="11" ry="5" fill="#000" opacity=".32"/>
  <rect x="-7.5" y="-30" width="15" height="31" rx="6.5" fill="currentColor"/>
  <rect x="-7.5" y="-30" width="15" height="31" rx="6.5" fill="#000" opacity=".16"/>
  <circle cx="0" cy="-36" r="7.4" fill="#c98d63"/>
  <path d="M-7.6 -38 a7.6 7.6 0 0 1 15.2 0 z" fill="#22272f"/>
</g>
<g id="personBag">
  <use href="#person"/>
  <rect x="9" y="-21" width="12" height="16" rx="3" fill="#f2b32c" stroke="#0b0e13" stroke-width="1.2"/>
</g>
<g id="personSeat">
  <ellipse cx="0" cy="1" rx="11" ry="5" fill="#000" opacity=".3"/>
  <rect x="-8" y="-21" width="16" height="22" rx="7" fill="currentColor"/>
  <rect x="-8" y="-21" width="16" height="22" rx="7" fill="#000" opacity=".2"/>
  <circle cx="0" cy="-27" r="7.4" fill="#c98d63"/>
  <path d="M-7.6 -29 a7.6 7.6 0 0 1 15.2 0 z" fill="#22272f"/>
</g>
<pattern id="soilHatch" width="18" height="18" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
  <rect width="18" height="18" fill="#3b3229"/>
  <line x1="0" y1="0" x2="0" y2="18" stroke="#4a4034" stroke-width="4"/>
</pattern>
<linearGradient id="sheetBg" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#151d29"/><stop offset="1" stop-color="#0a0d13"/>
</linearGradient>
<radialGradient id="glow" cx=".5" cy=".42" r=".62">
  <stop offset="0" stop-color="#2b3a52" stop-opacity=".8"/><stop offset="1" stop-color="#0c1017" stop-opacity="0"/>
</radialGradient>
<filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="16"/></filter>
<filter id="blur6" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
</defs>
<rect width="1600" height="1060" fill="url(#sheetBg)"/>

<text x="48" y="62" fill="#f2b32c" font-size="13" font-weight="700" letter-spacing="2.6">CONCEPT 08 // SOFTWARE SHAPE</text><text x="48" y="102" fill="#f2f6fb" font-size="36" font-weight="800">React + three.js, simulation in a worker</text><text x="48" y="130" fill="#93a1b3" font-size="15">The crowd sim never blocks the frame. React owns panels and state, three.js owns the scene, the worker owns 3,000 agents walking to a train.</text><defs><marker id="ah2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9fb3c8"/></marker></defs><rect x="60" y="190" width="300" height="170" rx="12" fill="#111926" stroke="#61dafb" stroke-width="1.8"/><text x="76" y="218" fill="#61dafb" font-size="14.5" font-weight="800">React 19 + Vite + TS</text><text x="76" y="242" fill="#93a1b3" font-size="11.5" font-family="ui-monospace,Consolas,monospace">panels, tool rail, inspector</text><text x="76" y="260" fill="#93a1b3" font-size="11.5" font-family="ui-monospace,Consolas,monospace">line manager, minimap</text><text x="76" y="278" fill="#93a1b3" font-size="11.5" font-family="ui-monospace,Consolas,monospace">zustand store (build + sim UI)</text><text x="76" y="296" fill="#93a1b3" font-size="11.5" font-family="ui-monospace,Consolas,monospace">immer patches -&gt; undo stack</text><rect x="60" y="390" width="300" height="150" rx="12" fill="#111926" stroke="#f2b32c" stroke-width="1.8"/><text x="76" y="418" fill="#f2b32c" font-size="14.5" font-weight="800">Build tools</text><text x="76" y="442" fill="#93a1b3" font-size="11.5" font-family="ui-monospace,Consolas,monospace">brush / box / line drag</text><text x="76" y="460" fill="#93a1b3" font-size="11.5" font-family="ui-monospace,Consolas,monospace">ghost preview + validity</text><text x="76" y="478" fill="#93a1b3" font-size="11.5" font-family="ui-monospace,Consolas,monospace">blueprint copy-paste</text><text x="76" y="496" fill="#93a1b3" font-size="11.5" font-family="ui-monospace,Consolas,monospace">writes BuildCommand[]</text><rect x="60" y="570" width="300" height="170" rx="12" fill="#111926" stroke="#a4703f" stroke-width="1.8"/><text x="76" y="598" fill="#a4703f" font-size="14.5" font-weight="800">Data + assets</text><text x="76" y="622" fill="#93a1b3" font-size="11.5" font-family="ui-monospace,Consolas,monospace">modules.json (a x b, rate)</text><text x="76" y="640" fill="#93a1b3" font-size="11.5" font-family="ui-monospace,Consolas,monospace">materials.json, lines.json</text><text x="76" y="658" fill="#93a1b3" font-size="11.5" font-family="ui-monospace,Consolas,monospace">save = seed + commands</text><text x="76" y="676" fill="#93a1b3" font-size="11.5" font-family="ui-monospace,Consolas,monospace">assets: GLB per module</text><rect x="60" y="770" width="300" height="170" rx="12" fill="#111926" stroke="#2fa84f" stroke-width="1.8"/><text x="76" y="798" fill="#2fa84f" font-size="14.5" font-weight="800">Render: react-three-fiber</text><text x="76" y="822" fill="#93a1b3" font-size="11.5" font-family="ui-monospace,Consolas,monospace">chunked voxel meshes</text><text x="76" y="840" fill="#93a1b3" font-size="11.5" font-family="ui-monospace,Consolas,monospace">InstancedMesh: 3k agents</text><text x="76" y="858" fill="#93a1b3" font-size="11.5" font-family="ui-monospace,Consolas,monospace">level slicing + cutaway</text><text x="76" y="876" fill="#93a1b3" font-size="11.5" font-family="ui-monospace,Consolas,monospace">postfx: soft AO, bloom</text><rect x="640" y="190" width="460" height="190" rx="12" fill="#111926" stroke="#2b6fd4" stroke-width="1.8"/><text x="656" y="218" fill="#2b6fd4" font-size="14.5" font-weight="800">Simulation worker  (5 Hz tick)</text><text x="656" y="242" fill="#93a1b3" font-size="11.5" font-family="ui-monospace,Consolas,monospace">agents[] with state machine</text><text x="656" y="260" fill="#93a1b3" font-size="11.5" font-family="ui-monospace,Consolas,monospace">spawn waves from demand curve</text><text x="656" y="278" fill="#93a1b3" font-size="11.5" font-family="ui-monospace,Consolas,monospace">3D flow-field / A* over level graph</text><text x="656" y="296" fill="#93a1b3" font-size="11.5" font-family="ui-monospace,Consolas,monospace">gate + escalator + train capacity queues</text><text x="656" y="314" fill="#93a1b3" font-size="11.5" font-family="ui-monospace,Consolas,monospace">train timetable, dwell, alight/board</text><text x="656" y="332" fill="#93a1b3" font-size="11.5" font-family="ui-monospace,Consolas,monospace">metrics: LOS, density, wait times</text><rect x="640" y="430" width="460" height="150" rx="12" fill="#111926" stroke="#7b4fa8" stroke-width="1.8"/><text x="656" y="458" fill="#7b4fa8" font-size="14.5" font-weight="800">Station graph</text><text x="656" y="482" fill="#93a1b3" font-size="11.5" font-family="ui-monospace,Consolas,monospace">nodes: cell, gate, platform, exit, train</text><text x="656" y="500" fill="#93a1b3" font-size="11.5" font-family="ui-monospace,Consolas,monospace">edges: walk, stair, escalator, lift</text><text x="656" y="518" fill="#93a1b3" font-size="11.5" font-family="ui-monospace,Consolas,monospace">vertical edges carry a level delta</text><text x="656" y="536" fill="#93a1b3" font-size="11.5" font-family="ui-monospace,Consolas,monospace">rebuilt on build (incremental)</text><rect x="640" y="620" width="460" height="150" rx="12" fill="#111926" stroke="#17a89a" stroke-width="1.8"/><text x="656" y="648" fill="#17a89a" font-size="14.5" font-weight="800">Frame loop</text><text x="656" y="672" fill="#93a1b3" font-size="11.5" font-family="ui-monospace,Consolas,monospace">rAF: interpolate agent positions</text><text x="656" y="690" fill="#93a1b3" font-size="11.5" font-family="ui-monospace,Consolas,monospace">buffer of {id, pos, state, anim}</text><text x="656" y="708" fill="#93a1b3" font-size="11.5" font-family="ui-monospace,Consolas,monospace">transferable ArrayBuffer, zero copy</text><text x="656" y="726" fill="#93a1b3" font-size="11.5" font-family="ui-monospace,Consolas,monospace">UI reads metrics at 2 Hz, not 60</text><rect x="640" y="800" width="460" height="140" rx="12" fill="#111926" stroke="#ef8c1e" stroke-width="1.8"/><text x="656" y="828" fill="#ef8c1e" font-size="14.5" font-weight="800">Determinism</text><text x="656" y="852" fill="#93a1b3" font-size="11.5" font-family="ui-monospace,Consolas,monospace">seed + tick -&gt; same crowd every run</text><text x="656" y="870" fill="#93a1b3" font-size="11.5" font-family="ui-monospace,Consolas,monospace">enables A/B of a layout change</text><text x="656" y="888" fill="#93a1b3" font-size="11.5" font-family="ui-monospace,Consolas,monospace">fast-forward: headless ticks, no draw</text><rect x="1190" y="190" width="350" height="190" rx="12" fill="#111926" stroke="#8fa0b3" stroke-width="1.8"/><text x="1206" y="218" fill="#8fa0b3" font-size="14.5" font-weight="800">Folder shape</text><text x="1206" y="242" fill="#93a1b3" font-size="11.5" font-family="ui-monospace,Consolas,monospace">src/</text><text x="1206" y="260" fill="#93a1b3" font-size="11.5" font-family="ui-monospace,Consolas,monospace">  ui/        panels, inspector</text><text x="1206" y="278" fill="#93a1b3" font-size="11.5" font-family="ui-monospace,Consolas,monospace">  build/     tools, commands, undo</text><text x="1206" y="296" fill="#93a1b3" font-size="11.5" font-family="ui-monospace,Consolas,monospace">  sim/       worker + graph + agents</text><text x="1206" y="314" fill="#93a1b3" font-size="11.5" font-family="ui-monospace,Consolas,monospace">  scene/     voxel meshes, agents</text><text x="1206" y="332" fill="#93a1b3" font-size="11.5" font-family="ui-monospace,Consolas,monospace">  data/      modules, materials</text><text x="1206" y="350" fill="#93a1b3" font-size="11.5" font-family="ui-monospace,Consolas,monospace">  state/     zustand slices</text><rect x="1190" y="420" width="350" height="210" rx="12" fill="#111926" stroke="#2fa84f" stroke-width="1.8"/><text x="1206" y="448" fill="#2fa84f" font-size="14.5" font-weight="800">Perf budget</text><text x="1206" y="472" fill="#93a1b3" font-size="11.5" font-family="ui-monospace,Consolas,monospace">16.6 ms frame, 60 fps target</text><text x="1206" y="490" fill="#93a1b3" font-size="11.5" font-family="ui-monospace,Consolas,monospace">voxel rebuild: chunk-local, &lt;4 ms</text><text x="1206" y="508" fill="#93a1b3" font-size="11.5" font-family="ui-monospace,Consolas,monospace">agents: 3,000 @ 60 fps instanced</text><text x="1206" y="526" fill="#93a1b3" font-size="11.5" font-family="ui-monospace,Consolas,monospace">sim tick 5 Hz, &lt;8 ms per tick</text><text x="1206" y="544" fill="#93a1b3" font-size="11.5" font-family="ui-monospace,Consolas,monospace">save file &lt; 2 MB for 60x60 station</text><rect x="1190" y="670" width="350" height="270" rx="12" fill="#111926" stroke="#f2b32c" stroke-width="1.8"/><text x="1206" y="698" fill="#f2b32c" font-size="14.5" font-weight="800">Milestones</text><text x="1206" y="722" fill="#93a1b3" font-size="11.5" font-family="ui-monospace,Consolas,monospace">M0  3D grid + camera + place</text><text x="1206" y="740" fill="#93a1b3" font-size="11.5" font-family="ui-monospace,Consolas,monospace">M1  surfaces + modules + save</text><text x="1206" y="758" fill="#93a1b3" font-size="11.5" font-family="ui-monospace,Consolas,monospace">M2  lines, tracks, trains</text><text x="1206" y="776" fill="#93a1b3" font-size="11.5" font-family="ui-monospace,Consolas,monospace">M3  agents + gates + platforms</text><text x="1206" y="794" fill="#93a1b3" font-size="11.5" font-family="ui-monospace,Consolas,monospace">M4  waves, exits, transfers</text><text x="1206" y="812" fill="#93a1b3" font-size="11.5" font-family="ui-monospace,Consolas,monospace">M5  multi-line, analytics, share</text><text x="1206" y="830" fill="#93a1b3" font-size="11.5" font-family="ui-monospace,Consolas,monospace">M6  steam-readiness, mods</text><path d="M360,275 L640,275" stroke="#61dafb" stroke-width="2" fill="none" marker-end="url(#ah2)" opacity=".9"/><rect x="448.2" y="255" width="103.60000000000001" height="20" rx="5" fill="#0b0f16" stroke="#61dafb" stroke-width="1" opacity=".95"/><text x="500" y="269" fill="#61dafb" font-size="11" font-family="ui-monospace,Consolas,monospace" text-anchor="middle">BuildCommand[]</text><path d="M360,465 L640,465" stroke="#f2b32c" stroke-width="2" fill="none" marker-end="url(#ah2)" opacity=".9"/><rect x="451.4" y="445" width="97.2" height="20" rx="5" fill="#0b0f16" stroke="#f2b32c" stroke-width="1" opacity=".95"/><text x="500" y="459" fill="#f2b32c" font-size="11" font-family="ui-monospace,Consolas,monospace" text-anchor="middle">place / erase</text><path d="M360,655 L640,655" stroke="#a4703f" stroke-width="2" fill="none" marker-end="url(#ah2)" opacity=".9"/><rect x="457.8" y="635" width="84.4" height="20" rx="5" fill="#0b0f16" stroke="#a4703f" stroke-width="1" opacity=".95"/><text x="500" y="649" fill="#a4703f" font-size="11" font-family="ui-monospace,Consolas,monospace" text-anchor="middle">module defs</text><path d="M640,690 L360,845" stroke="#17a89a" stroke-width="2" fill="none" marker-end="url(#ah2)" stroke-dasharray="7 6" opacity=".9"/><rect x="445" y="747.5" width="110" height="20" rx="5" fill="#0b0f16" stroke="#17a89a" stroke-width="1" opacity=".95"/><text x="500" y="761.5" fill="#17a89a" font-size="11" font-family="ui-monospace,Consolas,monospace" text-anchor="middle">instance buffer</text><path d="M360,830 L640,690" stroke="#2fa84f" stroke-width="2" fill="none" marker-end="url(#ah2)" stroke-dasharray="7 6" opacity=".9"/><rect x="448.2" y="740" width="103.60000000000001" height="20" rx="5" fill="#0b0f16" stroke="#2fa84f" stroke-width="1" opacity=".95"/><text x="500" y="754" fill="#2fa84f" font-size="11" font-family="ui-monospace,Consolas,monospace" text-anchor="middle">camera + slice</text><path d="M640,380 L640,430" stroke="#2b6fd4" stroke-width="2" fill="none" marker-end="url(#ah2)" opacity=".9"/><path d="M640,580 L640,620" stroke="#7b4fa8" stroke-width="2" fill="none" marker-end="url(#ah2)" opacity=".9"/><path d="M1100,330 L1190,285" stroke="#8fa0b3" stroke-width="2" fill="none" marker-end="url(#ah2)" opacity=".9"/><rect x="1122" y="287.5" width="46" height="20" rx="5" fill="#0b0f16" stroke="#8fa0b3" stroke-width="1" opacity=".95"/><text x="1145" y="301.5" fill="#8fa0b3" font-size="11" font-family="ui-monospace,Consolas,monospace" text-anchor="middle">reads</text>
</svg>