<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1060" width="1600" height="1060" font-family="Inter,'Noto Sans SC','Source Han Sans SC','Microsoft YaHei','PingFang SC','Hiragino Sans GB',Segoe UI,Helvetica,Arial,sans-serif">
<defs>
<g id="person">
  <ellipse cx="0" cy="1" rx="11" ry="5" fill="#000" opacity=".32"/>
  <rect x="-7.5" y="-30" width="15" height="31" rx="6.5" fill="currentColor"/>
  <rect x="-7.5" y="-30" width="15" height="31" rx="6.5" fill="#000" opacity=".16"/>
  <circle cx="0" cy="-36" r="7.4" fill="#c98d63"/>
  <path d="M-7.6 -38 a7.6 7.6 0 0 1 15.2 0 z" fill="#22272f"/>
</g>
<g id="personBag">
  <use href="#person"/>
  <rect x="9" y="-21" width="12" height="16" rx="3" fill="#f2b32c" stroke="#0b0e13" stroke-width="1.2"/>
</g>
<g id="personSeat">
  <ellipse cx="0" cy="1" rx="11" ry="5" fill="#000" opacity=".3"/>
  <rect x="-8" y="-21" width="16" height="22" rx="7" fill="currentColor"/>
  <rect x="-8" y="-21" width="16" height="22" rx="7" fill="#000" opacity=".2"/>
  <circle cx="0" cy="-27" r="7.4" fill="#c98d63"/>
  <path d="M-7.6 -29 a7.6 7.6 0 0 1 15.2 0 z" fill="#22272f"/>
</g>
<pattern id="soilHatch" width="18" height="18" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
  <rect width="18" height="18" fill="#3b3229"/>
  <line x1="0" y1="0" x2="0" y2="18" stroke="#4a4034" stroke-width="4"/>
</pattern>
<linearGradient id="sheetBg" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#151d29"/><stop offset="1" stop-color="#0a0d13"/>
</linearGradient>
<radialGradient id="glow" cx=".5" cy=".42" r=".62">
  <stop offset="0" stop-color="#2b3a52" stop-opacity=".8"/><stop offset="1" stop-color="#0c1017" stop-opacity="0"/>
</radialGradient>
<filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="16"/></filter>
<filter id="blur6" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
</defs>
<style>
@media (prefers-reduced-motion:reduce){.a-sway,.a-move,.a-doors,.a-spin,.a-breathe,.a-dash,.a-grow,.a-pulsew,.a-pass,.mvr{animation:none!important}}
@keyframes mSway{to{transform:translate(0,var(--ay,0px))}}
@keyframes mMove{0%,18%{transform:translate(0,0)}52%,68%{transform:translate(var(--ax,0px),var(--ay,0px))}100%{transform:translate(0,0)}}
@keyframes mDoors{0%,30%{transform:translate(0,0)}42%,72%{transform:translate(var(--ax,0px),var(--ay,0px))}84%,100%{transform:translate(0,0)}}
@keyframes mSpin{to{transform:rotate(360deg)}}
@keyframes mBreathe{to{opacity:var(--to,.3)}}
@keyframes mDash{to{stroke-dashoffset:var(--dash,-20px)}}
@keyframes mFade{0%,4%{opacity:0}12%,90%{opacity:1}96%,100%{opacity:0}}
@keyframes mGrow{0%,12%{width:0px}50%,86%{width:var(--w)}100%{width:0px}}
@keyframes mPulseW{0%,100%{width:var(--w)}50%{width:var(--w2)}}
@keyframes mPass{0%{transform:translate(calc(-1 * var(--s,-100px)),0)}16%{transform:translate(0,0)}70%{transform:translate(0,0)}86%,100%{transform:translate(var(--s,-100px),0)}}
.a-sway{animation-name:mSway;animation-duration:var(--dur,5s);animation-timing-function:ease-in-out;animation-delay:var(--delay,0s);animation-iteration-count:infinite;animation-direction:alternate}
.a-move{animation-name:mMove;animation-duration:var(--dur,16s);animation-timing-function:ease-in-out;animation-delay:var(--delay,0s);animation-iteration-count:infinite}
.a-doors{animation-name:mDoors;animation-duration:var(--dur,9s);animation-timing-function:ease-in-out;animation-delay:var(--delay,0s);animation-iteration-count:infinite}
.a-spin{animation-name:mSpin;animation-duration:var(--dur,18s);animation-timing-function:linear;animation-delay:var(--delay,0s);animation-iteration-count:infinite;transform-box:fill-box;transform-origin:center}
.a-breathe{animation-name:mBreathe;animation-duration:var(--dur,4s);animation-timing-function:ease-in-out;animation-delay:var(--delay,0s);animation-iteration-count:infinite;animation-direction:alternate}
.a-dash{animation-name:mDash;animation-duration:var(--dur,1.6s);animation-timing-function:linear;animation-delay:var(--delay,0s);animation-iteration-count:infinite}
.a-grow{animation-name:mGrow;animation-duration:var(--dur,10s);animation-timing-function:ease-in-out;animation-delay:var(--delay,0s);animation-iteration-count:infinite}
.a-pulsew{animation-name:mPulseW;animation-duration:var(--dur,4s);animation-timing-function:ease-in-out;animation-delay:var(--delay,0s);animation-iteration-count:infinite}
.a-pass{animation-name:mPass;animation-duration:var(--dur,20s);animation-timing-function:ease-in-out;animation-delay:var(--delay,0s);animation-iteration-count:infinite}
@keyframes kf40{0.000%{transform:translate(360px,275px)}100.000%{transform:translate(640px,275px)}}@keyframes kf41{0.000%{transform:translate(360px,465px)}100.000%{transform:translate(640px,465px)}}@keyframes kf42{0.000%{transform:translate(360px,655px)}100.000%{transform:translate(640px,655px)}}@keyframes kf43{0.000%{transform:translate(640px,690px)}100.000%{transform:translate(360px,845px)}}@keyframes kf44{0.000%{transform:translate(360px,830px)}100.000%{transform:translate(640px,690px)}}@keyframes kf45{0.000%{transform:translate(640px,380px)}100.000%{transform:translate(640px,430px)}}@keyframes kf46{0.000%{transform:translate(640px,580px)}100.000%{transform:translate(640px,620px)}}@keyframes kf47{0.000%{transform:translate(1100px,330px)}100.000%{transform:translate(1190px,285px)}}</style>
<rect width="1600" height="1060" fill="url(#sheetBg)"/>

<text x="48" y="62" fill="#f2b32c" font-size="13" font-weight="700" letter-spacing="2.6">概念 08 // 软件结构</text><text x="48" y="102" fill="#f2f6fb" font-size="36" font-weight="800">React + three.js，仿真跑在 Worker 里</text><text x="48" y="130" fill="#93a1b3" font-size="15">仿真从不拖累画面。React 管面板和状态，three.js 管场景，Worker 管 3000 个正往列车走的人。</text><defs><marker id="ah2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9fb3c8"/></marker></defs><rect x="60" y="190" width="300" height="170" rx="12" fill="#111926" stroke="#61dafb" stroke-width="1.8"/><text x="76" y="218" fill="#61dafb" font-size="14.5" font-weight="800">React 19 + Vite + TS</text><text x="76" y="242" fill="#93a1b3" font-size="11.5" font-family="ui-monospace,Consolas,monospace">面板、工具条、属性栏</text><text x="76" y="260" fill="#93a1b3" font-size="11.5" font-family="ui-monospace,Consolas,monospace">线路管理、小地图</text><text x="76" y="278" fill="#93a1b3" font-size="11.5" font-family="ui-monospace,Consolas,monospace">zustand 状态（建造 + 仿真 UI）</text><text x="76" y="296" fill="#93a1b3" font-size="11.5" font-family="ui-monospace,Consolas,monospace">immer 补丁 → 撤销栈</text><rect x="60" y="390" width="300" height="150" rx="12" fill="#111926" stroke="#f2b32c" stroke-width="1.8"/><text x="76" y="418" fill="#f2b32c" font-size="14.5" font-weight="800">建造工具</text><text x="76" y="442" fill="#93a1b3" font-size="11.5" font-family="ui-monospace,Consolas,monospace">笔刷 / 框选 / 线拖拽</text><text x="76" y="460" fill="#93a1b3" font-size="11.5" font-family="ui-monospace,Consolas,monospace">虚影预览 + 合法性校验</text><text x="76" y="478" fill="#93a1b3" font-size="11.5" font-family="ui-monospace,Consolas,monospace">蓝图复制粘贴</text><text x="76" y="496" fill="#93a1b3" font-size="11.5" font-family="ui-monospace,Consolas,monospace">写入 BuildCommand[]</text><rect x="60" y="570" width="300" height="170" rx="12" fill="#111926" stroke="#a4703f" stroke-width="1.8"/><text x="76" y="598" fill="#a4703f" font-size="14.5" font-weight="800">数据与资源</text><text x="76" y="622" fill="#93a1b3" font-size="11.5" font-family="ui-monospace,Consolas,monospace">modules.json（a × b，速率）</text><text x="76" y="640" fill="#93a1b3" font-size="11.5" font-family="ui-monospace,Consolas,monospace">materials.json、lines.json</text><text x="76" y="658" fill="#93a1b3" font-size="11.5" font-family="ui-monospace,Consolas,monospace">存档 = 种子 + 指令</text><text x="76" y="676" fill="#93a1b3" font-size="11.5" font-family="ui-monospace,Consolas,monospace">资源：每个模块一个 GLB</text><rect x="60" y="770" width="300" height="170" rx="12" fill="#111926" stroke="#2fa84f" stroke-width="1.8"/><text x="76" y="798" fill="#2fa84f" font-size="14.5" font-weight="800">渲染：react-three-fiber</text><text x="76" y="822" fill="#93a1b3" font-size="11.5" font-family="ui-monospace,Consolas,monospace">分块体素网格</text><text x="76" y="840" fill="#93a1b3" font-size="11.5" font-family="ui-monospace,Consolas,monospace">InstancedMesh：3000 个人</text><text x="76" y="858" fill="#93a1b3" font-size="11.5" font-family="ui-monospace,Consolas,monospace">楼层切片 + 剖切</text><text x="76" y="876" fill="#93a1b3" font-size="11.5" font-family="ui-monospace,Consolas,monospace">后处理：柔和 AO、辉光</text><rect x="640" y="190" width="460" height="190" rx="12" fill="#111926" stroke="#2b6fd4" stroke-width="1.8"/><text x="656" y="218" fill="#2b6fd4" font-size="14.5" font-weight="800">仿真 Worker（5 Hz 步进）</text><text x="656" y="242" fill="#93a1b3" font-size="11.5" font-family="ui-monospace,Consolas,monospace">agents[] 带状态机</text><text x="656" y="260" fill="#93a1b3" font-size="11.5" font-family="ui-monospace,Consolas,monospace">按需求曲线生成客流波</text><text x="656" y="278" fill="#93a1b3" font-size="11.5" font-family="ui-monospace,Consolas,monospace">楼层图上的三维流场 / A*</text><text x="656" y="296" fill="#93a1b3" font-size="11.5" font-family="ui-monospace,Consolas,monospace">闸机 + 扶梯 + 列车 运力队列</text><text x="656" y="314" fill="#93a1b3" font-size="11.5" font-family="ui-monospace,Consolas,monospace">列车时刻表、停站、上下车</text><text x="656" y="332" fill="#93a1b3" font-size="11.5" font-family="ui-monospace,Consolas,monospace">指标：服务水平、密度、等待时间</text><rect x="640" y="430" width="460" height="150" rx="12" fill="#111926" stroke="#7b4fa8" stroke-width="1.8"/><text x="656" y="458" fill="#7b4fa8" font-size="14.5" font-weight="800">车站图</text><text x="656" y="482" fill="#93a1b3" font-size="11.5" font-family="ui-monospace,Consolas,monospace">节点：格、闸机、站台、出口、列车</text><text x="656" y="500" fill="#93a1b3" font-size="11.5" font-family="ui-monospace,Consolas,monospace">边：步行、楼梯、扶梯、电梯</text><text x="656" y="518" fill="#93a1b3" font-size="11.5" font-family="ui-monospace,Consolas,monospace">竖向边带有楼层高差</text><text x="656" y="536" fill="#93a1b3" font-size="11.5" font-family="ui-monospace,Consolas,monospace">建造时增量重建</text><rect x="640" y="620" width="460" height="150" rx="12" fill="#111926" stroke="#17a89a" stroke-width="1.8"/><text x="656" y="648" fill="#17a89a" font-size="14.5" font-weight="800">帧循环</text><text x="656" y="672" fill="#93a1b3" font-size="11.5" font-family="ui-monospace,Consolas,monospace">rAF：给每个人插值位置</text><text x="656" y="690" fill="#93a1b3" font-size="11.5" font-family="ui-monospace,Consolas,monospace">{id, pos, state, anim} 缓冲</text><text x="656" y="708" fill="#93a1b3" font-size="11.5" font-family="ui-monospace,Consolas,monospace">可转移 ArrayBuffer，零拷贝</text><text x="656" y="726" fill="#93a1b3" font-size="11.5" font-family="ui-monospace,Consolas,monospace">UI 以 2 Hz 读取指标，而非 60</text><rect x="640" y="800" width="460" height="140" rx="12" fill="#111926" stroke="#ef8c1e" stroke-width="1.8"/><text x="656" y="828" fill="#ef8c1e" font-size="14.5" font-weight="800">确定性</text><text x="656" y="852" fill="#93a1b3" font-size="11.5" font-family="ui-monospace,Consolas,monospace">种子 + 步进 → 每次运行人群一致</text><text x="656" y="870" fill="#93a1b3" font-size="11.5" font-family="ui-monospace,Consolas,monospace">可以 A/B 对比布局改动</text><text x="656" y="888" fill="#93a1b3" font-size="11.5" font-family="ui-monospace,Consolas,monospace">快进：无渲染步进，不绘图</text><rect x="1190" y="190" width="350" height="190" rx="12" fill="#111926" stroke="#8fa0b3" stroke-width="1.8"/><text x="1206" y="218" fill="#8fa0b3" font-size="14.5" font-weight="800">目录结构</text><text x="1206" y="242" fill="#93a1b3" font-size="11.5" font-family="ui-monospace,Consolas,monospace">src/</text><text x="1206" y="260" fill="#93a1b3" font-size="11.5" font-family="ui-monospace,Consolas,monospace">  ui/        面板、属性栏</text><text x="1206" y="278" fill="#93a1b3" font-size="11.5" font-family="ui-monospace,Consolas,monospace">  build/     工具、指令、撤销</text><text x="1206" y="296" fill="#93a1b3" font-size="11.5" font-family="ui-monospace,Consolas,monospace">  sim/       Worker + 图 + 人</text><text x="1206" y="314" fill="#93a1b3" font-size="11.5" font-family="ui-monospace,Consolas,monospace">  scene/     体素网格、人群</text><text x="1206" y="332" fill="#93a1b3" font-size="11.5" font-family="ui-monospace,Consolas,monospace">  data/      模块、材质</text><text x="1206" y="350" fill="#93a1b3" font-size="11.5" font-family="ui-monospace,Consolas,monospace">  state/     zustand 分片</text><rect x="1190" y="420" width="350" height="210" rx="12" fill="#111926" stroke="#2fa84f" stroke-width="1.8"/><text x="1206" y="448" fill="#2fa84f" font-size="14.5" font-weight="800">性能预算</text><text x="1206" y="472" fill="#93a1b3" font-size="11.5" font-family="ui-monospace,Consolas,monospace">16.6 毫秒/帧，目标 60 fps</text><text x="1206" y="490" fill="#93a1b3" font-size="11.5" font-family="ui-monospace,Consolas,monospace">体素重建：分块局部，&lt;4 毫秒</text><text x="1206" y="508" fill="#93a1b3" font-size="11.5" font-family="ui-monospace,Consolas,monospace">乘客：3,000 个 @ 60 fps 实例化</text><text x="1206" y="526" fill="#93a1b3" font-size="11.5" font-family="ui-monospace,Consolas,monospace">仿真步进 5 Hz，每步 &lt;8 毫秒</text><text x="1206" y="544" fill="#93a1b3" font-size="11.5" font-family="ui-monospace,Consolas,monospace">60×60 车站存档 &lt; 2 MB</text><rect x="1190" y="670" width="350" height="27