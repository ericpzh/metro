<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Metro — Human candidates</title></head>
<body class="candidate-page"><main>
<header><div><p class="eyebrow">Station Designer · 模型库</p><h1 id="title">Human candidates</h1></div><nav><a href="./">Reviewed passengers / 当前乘客</a><select id="language" aria-label="Language"><option value="en">English</option><option value="zh">中文</option></select></nav></header>
<p id="intro"></p>
<section class="workspace"><aside>
<label id="candidate-label" for="candidate"></label><select id="candidate"></select>
<p id="description" class="hint"></p><a id="source" target="_blank" rel="noreferrer"></a>
<label id="mode-label" for="render-mode"></label><select id="render-mode"></select>
<div id="motion-controls"><label for="motion">Motion / 动作</label><select id="motion"></select><button id="motion-play">Pause motion</button><label for="motion-timeline">Motion phase / 动作进度</label><input id="motion-timeline" type="range" min="0" max="1" step="0.001" value="0"></div>
<div id="source-controls" hidden>
<label id="animation-label" for="animation"></label><select id="animation"></select>
<div class="playback"><button id="play"></button><button id="reset"></button></div>
<label id="timeline-label" for="timeline"></label><input id="timeline" type="range" min="0" max="1" step="0.001" value="0">
</div><button id="pick" aria-pressed="false"></button><p id="picks" aria-live="polite"></p>
<p id="note" class="hint"></p><p><a href="./human-candidates/manifest.json">Sources & asset hashes / 来源</a></p>
</aside><div id="view"><div id="status" role="status"></div><input id="live-angle" aria-label="Animated view angle" type="range" min="0" max="15" step="1" value="0"><section id="image-study" aria-label="Grayscale character preview"><h2 id="study-title"></h2><p id="study-name"></p><div class="study-pair"><figure id="original-figure"><div id="study-original" class="study-frame"></div><figcaption id="original-caption"></figcaption></figure><figure><div id="study-clean" class="study-frame"></div><figcaption id="clean-caption"></figcaption></figure></div><label id="angle-label" for="study-angle"></label> <output id="study-degrees">0°</output><input id="study-angle" type="range" min="0" max="15" step="1" value="0"><p><a id="original-sheet" target="_blank" rel="noreferrer"></a> · <a id="clean-sheet" target="_blank" rel="noreferrer"></a></p></section></div></section>
<footer><div class="views"><button data-view="front">Front / 正面</button><button data-view="three">¾</button><button data-view="side">Side / 侧面</button><button data-view="back">Back / 背面</button><button id="rotate">Rotate / 旋转</button></div><p id="orbit-hint"></p></footer>
</main><script type="module" src="/src/candidates.js"></script></body></html>
