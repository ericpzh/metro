<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Station Designer — Models</title></head>
<body>
<main>
 <header><div><p class="eyebrow" data-i18n="project"></p><h1 data-i18n="title"></h1></div><nav><a id="site-link" data-i18n="site"></a><a id="game-link" data-i18n="game"></a><select id="language" aria-label="Language"><option value="en">English</option><option value="zh">中文</option></select></nav></header>
 <p><a href="./sounds.html">Sound studio — interaction effects & ambient listening ↗</a></p>
 <section class="workspace">
  <aside>
   <label for="age" data-i18n="age"></label><select id="age"><option value="adult" data-i18n="adult"></option><option value="child" data-i18n="child"></option></select>
   <label for="character" data-i18n="character"></label><select id="character"><option value="female" data-i18n="female"></option><option value="male" data-i18n="male"></option></select>
   <label for="hair" data-i18n="hair"></label><select id="hair"><option value="bob" data-i18n="bob"></option><option value="shoulder" data-i18n="shoulder"></option><option value="long" data-i18n="long"></option></select>
   <label for="outfit" data-i18n="outfit"></label><select id="outfit"></select>
   <button id="swap-tones" data-i18n="swapTones" aria-pressed="false"></button>
   <p class="hint" id="outfit-hint"></p>
   <label for="bag" data-i18n="bag"></label><select id="bag"><option value="1" data-i18n="withBag"></option><option value="standard-87.5" data-i18n="mediumStandardBag"></option><option value="standard-75" data-i18n="compactStandardBag"></option><option value="small" data-i18n="smallBag"></option><option value="0" data-i18n="noBag"></option></select>
   <p class="hint" id="variant-hint"></p>
   <fieldset class="size-controls"><legend data-i18n="size"></legend>
    <div class="size-label"><label for="height" data-i18n="height"></label><output id="height-value" for="height"></output></div><input id="height" type="range" min="80" max="120" value="100" step="1">
    <div class="size-label"><label for="width" data-i18n="width"></label><output id="width-value" for="width"></output></div><input id="width" type="range" min="90" max="110" value="100" step="1">
    <div class="size-label"><label for="depth" data-i18n="depth"></label><output id="depth-value" for="depth"></output></div><input id="depth" type="range" min="90" max="110" value="100" step="1">
    <button id="reset-size" data-i18n="resetSize"></button>
   </fieldset>
   <button id="randomize" data-i18n="randomize"></button><p class="hint" data-i18n="randomHint"></p>
   <label for="profile" data-i18n="profile"></label><select id="profile"><option value="0" data-i18n="slow"></option><option value="1" data-i18n="medium"></option><option value="2" data-i18n="fast"></option></select>
   <div class="playback"><button id="play"></button><button id="stand" data-i18n="stand"></button></div>
   <a id="download" class="download" download data-i18n="download"></a>
   <figure><img id="reference"><figcaption data-i18n="reference"></figcaption></figure>
  </aside>
  <div id="view"><div id="status" role="status"></div></div>
 </section>
 <footer><div class="views"><button data-view="front" data-i18n="front"></button><button data-view="three" data-i18n="three"></button><button data-view="side" data-i18n="side"></button><button data-view="back" data-i18n="back"></button><button id="rotate" data-i18n="rotate"></button></div><p data-i18n="orbitHint"></p></footer>
</main>
<script type="module" src="/src/main.js"></script>
</body></html>
